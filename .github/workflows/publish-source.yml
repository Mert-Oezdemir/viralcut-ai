name: Publish audited ViralCut AI source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack pre-audited source bundle (if present)
        shell: bash
        run: |
          if [ ! -f .source/viralcut-ai.tar.xz ]; then
            echo "No bundle to unpack"
            exit 0
          fi
          tar -xJf .source/viralcut-ai.tar.xz --strip-components=1
          rm -f .source/viralcut-ai.tar.xz
          rmdir .source 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish audited ViralCut AI v0.2 source"
            git push
          fi
