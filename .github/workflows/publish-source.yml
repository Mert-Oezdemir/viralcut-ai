name: Publish audited ViralCut AI source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack pre-audited source bundle (only when ready)
        shell: bash
        run: |
          if [ ! -f .source/READY ]; then
            echo "Source bundle is not ready yet"
            exit 0
          fi
          cat .source/source.part* | base64 --decode > /tmp/viralcut-source.tar.xz
          echo "bdb62f89090a0f38b65e9bbcd81d4f005fe6443c8038ade2352f023a87bd15a7  /tmp/viralcut-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/viralcut-source.tar.xz --strip-components=1
          rm -rf .source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish audited ViralCut AI v0.2 source"
            git push
          fi
